services:
  - type: web
    name: -pinterest-automation-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /ping
    envVars:
      - key: TELEGRAM_CHANNELS
        sync: false
      - key: TELEGRAM_CHANNEL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: PINTEREST_ACCESS_TOKEN
        sync: false
      - key: PINTEREST_BOARD_ID
        sync: false
      - key: AMAZON_AFFILIATE_TAG
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JSONBIN_API_KEY
        sync: false
      - key: JSONBIN_BIN_ID
        sync: false
      - key: AUTO_POST_MODE
        value: "true"
      - key: DRY_RUN
        value: "false"
      - key: POST_DELAY_MINUTES
        value: "10"
      - key: MAX_POSTS_PER_DAY
        value: "3"
      # Are.na Cross-Posting
      - key: ARENA_ACCESS_TOKEN
        sync: false
      - key: ARENA_CHANNEL_SLUG
        sync: false
      - key: ARENA_ENABLED
        value: "true"
      # Tumblr Cross-Posting
      - key: TUMBLR_CONSUMER_KEY
        sync: false
      - key: TUMBLR_CONSUMER_SECRET
        sync: false
      - key: TUMBLR_ACCESS_TOKEN
        sync: false
      - key: TUMBLR_ACCESS_TOKEN_SECRET
        sync: false
      - key: TUMBLR_BLOG_NAME
        sync: false
      - key: TUMBLR_TAGS
        value: "anime,aesthetic,animeart,wallpaper,pinterest"
      - key: TUMBLR_ENABLED
        value: "true"
      # Bluesky Cross-Posting
      - key: BLUESKY_HANDLE
        sync: false
      - key: BLUESKY_APP_PASSWORD
        sync: false
      - key: BLUESKY_ENABLED
        value: "true"
      # Raindrop.io Cross-Posting
      - key: RAINDROP_ACCESS_TOKEN
        sync: false
      - key: RAINDROP_COLLECTION_ID
        sync: false
      - key: RAINDROP_ENABLED
        value: "true"



